<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crib t02 - loading + environment</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<!-- mode = hdr (default) | blur | split | nodes | pmrem -->
<script type="module">
import * as THREE from 'three/webgpu';
import { pmremTexture, texture, equirectUV, positionWorldDirection, normalWorldGeometry, color, mix, uniform, float, vec3 } from 'three/tsl';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { str, report } from './_common.js';

const mode = str( 'mode', 'hdr' );
const info = { mode };

const renderer = new THREE.WebGPURenderer( { antialias: true, alpha: false } );
renderer.setPixelRatio( 1 );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild( renderer.domElement );
await renderer.init(); // KTX2Loader.detectSupport() needs an initialized renderer (it calls renderer.hasFeature)

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
camera.position.set( 0, 1.2, 4.6 );
camera.lookAt( 0, 0.55, 0 );

// ---------------------------------------------------------------- loaders
// DRACOLoader: decoder files resolve relative to the addon module by default (new URL( '../libs/draco/..', import.meta.url ));
// DRACO_GLTF_CONFIG selects the smaller glTF-only decoder. A string path works too: setDecoderPath( '/libs/draco/gltf/' ).
const dracoLoader = new DRACOLoader().setDecoderPath( DRACO_GLTF_CONFIG );
// KTX2Loader: the transcoder path is REQUIRED ('' default does not resolve relative to the module)
const ktx2Loader = new KTX2Loader().setTranscoderPath( '/libs/basis/' ).detectSupport( renderer );
const gltfLoader = new GLTFLoader().setDRACOLoader( dracoLoader ).setKTX2Loader( ktx2Loader ).setMeshoptDecoder( MeshoptDecoder );

const [ gltfMeshopt, gltfDraco, ktxTex, hdr ] = await Promise.all( [
	gltfLoader.loadAsync( './assets/coffeemat/coffeemat.glb' ),               // EXT_meshopt_compression + KHR_texture_basisu + KHR_mesh_quantization
	gltfLoader.loadAsync( './assets/coffeemat-draco/coffeemat-draco.glb' ),   // KHR_draco_mesh_compression + KHR_texture_basisu
	ktx2Loader.loadAsync( './assets/ktx2/2d_uastc.ktx2' ),
	new HDRLoader().loadAsync( './assets/hdri/kloofendal_48d_partly_cloudy_puresky_1k.hdr' ),
] );

function fit( root, x ) {

	const box = new THREE.Box3().setFromObject( root );
	const size = box.getSize( new THREE.Vector3() );
	const s = 1.1 / size.y;
	root.scale.setScalar( s );
	box.setFromObject( root );
	const c = box.getCenter( new THREE.Vector3() );
	root.position.set( x - c.x, - box.min.y, - c.z );
	scene.add( root );

}

fit( gltfMeshopt.scene, - 1.1 );
fit( gltfDraco.scene, 1.1 );

const describe = ( gltf ) => {

	const out = { meshes: 0, tris: 0, materials: {}, textures: {} };
	gltf.scene.traverse( ( o ) => {

		if ( ! o.isMesh ) return;
		out.meshes ++;
		out.tris += ( o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count ) / 3;
		out.materials[ o.material.name ] = o.material.type + ( o.material.isNodeMaterial ? ' (node)' : ' (classic)' );
		for ( const k of [ 'map', 'normalMap', 'roughnessMap', 'aoMap' ] ) {

			const t = o.material[ k ];
			if ( t ) out.textures[ k ] = { compressed: t.isCompressedTexture === true, format: t.format, colorSpace: t.colorSpace, w: t.image.width, h: t.image.height, mipmaps: t.mipmaps ? t.mipmaps.length : 0, anisotropy: t.anisotropy };

		}

		out.posType = o.geometry.attributes.position.array.constructor.name;
		out.posNormalized = o.geometry.attributes.position.normalized;

	} );
	return out;

};

info.meshopt = describe( gltfMeshopt );
info.draco = describe( gltfDraco );
info.ktx2 = { isCompressedTexture: ktxTex.isCompressedTexture === true, format: ktxTex.format, colorSpace: ktxTex.colorSpace, w: ktxTex.image.width, h: ktxTex.image.height, mipmaps: ktxTex.mipmaps.length };
info.hdr = { type: hdr.type === THREE.HalfFloatType ? 'HalfFloat' : hdr.type, colorSpace: hdr.colorSpace, w: hdr.image.width, h: hdr.image.height, mapping: hdr.mapping, flipY: hdr.flipY };

// a quad showing the standalone KTX2 texture + a TextureLoader texture with explicit settings
const tl = new THREE.TextureLoader();
const jpg = await tl.loadAsync( './assets/water/waternormals.jpg' );
jpg.colorSpace = THREE.NoColorSpace;                 // data texture (normal map): NoColorSpace; albedo/emissive: SRGBColorSpace
jpg.wrapS = jpg.wrapT = THREE.RepeatWrapping;
jpg.repeat.set( 4, 4 );
jpg.anisotropy = Math.min( 8, renderer.getMaxAnisotropy() );
info.textureLoader = { defaultColorSpaceWas: 'NoColorSpace (must be set by the app)', flipY: jpg.flipY, generateMipmaps: jpg.generateMipmaps, minFilter: jpg.minFilter === THREE.LinearMipmapLinearFilter ? 'LinearMipmapLinear' : jpg.minFilter, anisotropy: jpg.anisotropy };

const q1 = new THREE.Mesh( new THREE.PlaneGeometry( 0.8, 0.8 ), new THREE.MeshBasicMaterial( { map: ktxTex } ) );
q1.position.set( 0, 1.75, 0 );
scene.add( q1 );

const floor = new THREE.Mesh( new THREE.CircleGeometry( 4, 64 ), new THREE.MeshStandardMaterial( { color: 0x888888, roughness: 0.35, metalness: 0, normalMap: jpg, normalScale: new THREE.Vector2( 0.3, 0.3 ) } ) );
floor.rotation.x = - Math.PI / 2;
scene.add( floor );

const ball = new THREE.Mesh( new THREE.SphereGeometry( 0.35, 64, 32 ), new THREE.MeshStandardMaterial( { color: 0xffffff, metalness: 1, roughness: 0.05 } ) );
ball.position.set( 0, 0.35, 0.9 );
scene.add( ball );
const ball2 = new THREE.Mesh( new THREE.SphereGeometry( 0.35, 64, 32 ), new THREE.MeshStandardMaterial( { color: 0xffffff, metalness: 0, roughness: 1 } ) );
ball2.position.set( 0, 0.35, - 0.2 );
scene.add( ball2 );

// ---------------------------------------------------------------- environment
hdr.mapping = THREE.EquirectangularReflectionMapping; // REQUIRED for scene.background / scene.environment with an equirect texture

if ( mode === 'hdr' ) {

	scene.background = hdr;      // drawn as a sky sphere
	scene.environment = hdr;     // PMREM is generated automatically on first use (PMREMGenerator not needed)

} else if ( mode === 'blur' ) {

	scene.background = hdr;
	scene.environment = hdr;
	scene.backgroundBlurriness = 0.35;                       // > 0 switches the background to the PMREM version
	scene.backgroundIntensity = 0.6;
	scene.backgroundRotation.set( 0, Math.PI * 0.5, 0 );    // Euler
	scene.environmentIntensity = 1.5;
	scene.environmentRotation.set( 0, Math.PI * 0.5, 0 );   // keep in sync with the background

} else if ( mode === 'split' ) {

	// different textures for what you see and what lights the scene
	const pmrem = new THREE.PMREMGenerator( renderer );
	const sky = new THREE.Scene();
	sky.background = new THREE.Color( 0xff8844 );
	const rt = pmrem.fromScene( sky, 0 );      // also: pmrem.fromEquirectangular( hdr ), pmrem.fromCubemap( cube )
	pmrem.dispose();
	scene.background = hdr;
	scene.environment = rt.texture;            // orange PMREM lighting, HDR background
	info.pmremTexture = { isPMREMTexture: rt.texture.isPMREMTexture === true, mapping: rt.texture.mapping === THREE.CubeUVReflectionMapping ? 'CubeUV' : rt.texture.mapping };

} else if ( mode === 'nodes' ) {

	// procedural sky as background; lighting from the HDR with a tint, both via nodes
	const horizon = color( 0xffc58a ), zenith = color( 0x2a5fa8 ), ground = color( 0x3a3530 );
	const dir = positionWorldDirection;  // direction of the background sphere fragment (also: normalWorldGeometry)
	const up = dir.y;
	scene.backgroundNode = mix( mix( horizon, zenith, up.max( 0 ).pow( 0.45 ) ), ground, up.negate().smoothstep( 0, 0.05 ) );
	scene.environmentNode = pmremTexture( hdr ).mul( vec3( 1.0, 0.85, 0.7 ) ); // uv/level are provided by the lighting context
	scene.environmentIntensity = 1;

} else if ( mode === 'pmrem' ) {

	// explicit equirect sampling (no cube conversion): background = sharp equirect lookup, level 0
	scene.backgroundNode = texture( hdr, equirectUV( normalWorldGeometry ), 0 );
	scene.environment = hdr;

}

const sun = new THREE.DirectionalLight( 0xffffff, 2 );
sun.position.set( 3, 5, 2 );
scene.add( sun );

await renderer.compileAsync( scene, camera );

let frame = 0;
renderer.setAnimationLoop( () => {

	renderer.render( scene, camera );
	if ( ++ frame === 25 ) {

		info.render = { drawCalls: renderer.info.render.drawCalls, triangles: renderer.info.render.triangles };
		info.memory = { textures: renderer.info.memory.textures, texturesMB: Math.round( renderer.info.memory.texturesSize / 1048576 ) };
		report( info );

	}

} );
</script>
</body>
</html>
