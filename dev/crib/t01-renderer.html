<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crib t01 - renderer</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<!-- Renderer basics. Params: webgl=1 (forceWebGL), aa=1 (antialias), rev=1 (reversedDepthBuffer), log=1 (logarithmicDepthBuffer), ubyte=1 (outputBufferType UnsignedByteType) -->
<script type="module">
import * as THREE from 'three/webgpu';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { q, flag, report, checkerTexture } from './_common.js';

const info = {};

const renderer = new THREE.WebGPURenderer( {
	antialias: flag( 'aa' ),          // MSAA x4 on the canvas / default pass targets (samples: n overrides)
	alpha: false,                      // default TRUE (transparent canvas) -> set false for an opaque game canvas
	depth: true,
	stencil: false,
	forceWebGL: flag( 'webgl' ),
	powerPreference: 'high-performance',
	trackTimestamp: true,              // enables GPU timestamp queries (resolveTimestampsAsync)
	reversedDepthBuffer: flag( 'rev' ),
	logarithmicDepthBuffer: flag( 'log' ),
	outputBufferType: flag( 'ubyte' ) ? THREE.UnsignedByteType : THREE.HalfFloatType,
} );
renderer.setPixelRatio( 1 );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

let deviceLost = null;
renderer.onDeviceLost = ( i ) => { deviceLost = i; };
let backendError = null;
renderer.onError = ( i ) => { backendError = i; };

document.body.appendChild( renderer.domElement );

info.initializedBefore = renderer.initialized;
await renderer.init();
info.initializedAfter = renderer.initialized;

info.isWebGPUBackend = renderer.backend.isWebGPUBackend === true;
info.isWebGLBackend = renderer.backend.isWebGLBackend === true;
info.backendClass = renderer.backend.constructor.name;
info.coordinateSystem = renderer.coordinateSystem === THREE.WebGPUCoordinateSystem ? 'WebGPU' : ( renderer.coordinateSystem === THREE.WebGLCoordinateSystem ? 'WebGL' : renderer.coordinateSystem );
info.compatibilityMode = renderer.backend.compatibilityMode;
info.samples = renderer.samples;
info.maxAnisotropy = renderer.getMaxAnisotropy();
info.hasTimestampQuery = renderer.hasFeature( 'timestamp-query' );
info.trackTimestamp = renderer.backend.trackTimestamp;
info.outputBufferType = renderer.getOutputBufferType() === THREE.HalfFloatType ? 'HalfFloat' : 'other';
info.needsFrameBufferTarget = renderer.needsFrameBufferTarget;
info.shadowMapDefaults = { ...renderer.shadowMap };
info.shadowTypes = { BasicShadowMap: THREE.BasicShadowMap, PCFShadowMap: THREE.PCFShadowMap, PCFSoftShadowMap: THREE.PCFSoftShadowMap, VSMShadowMap: THREE.VSMShadowMap };
if ( renderer.backend.isWebGPUBackend ) {

	const d = renderer.backend.device;
	info.device = { maxTextureDimension2D: d.limits.maxTextureDimension2D, maxUniformBufferBindingSize: d.limits.maxUniformBufferBindingSize, maxVertexBuffers: d.limits.maxVertexBuffers, maxColorAttachments: d.limits.maxColorAttachments, features: [ ...d.features ].sort() };

}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 200 );
camera.position.set( 4, 3, 7 );
camera.lookAt( 0, 0.7, 0 );

const pmrem = new THREE.PMREMGenerator( renderer );
scene.environment = pmrem.fromScene( new RoomEnvironment(), 0.04 ).texture;
pmrem.dispose();
scene.background = new THREE.Color( 0x8fa3b8 );

const sun = new THREE.DirectionalLight( 0xfff1dd, 3 );
sun.position.set( 5, 8, 4 );
sun.castShadow = true;
sun.shadow.mapSize.set( 2048, 2048 );
Object.assign( sun.shadow.camera, { left: - 8, right: 8, top: 8, bottom: - 8, near: 0.5, far: 30 } );
sun.shadow.bias = - 0.0005;
sun.shadow.normalBias = 0.02;
scene.add( sun );

const floor = new THREE.Mesh( new THREE.PlaneGeometry( 40, 40 ), new THREE.MeshStandardMaterial( { map: checkerTexture(), roughness: 0.8 } ) );
floor.material.map.repeat.set( 10, 10 );
floor.rotation.x = - Math.PI / 2;
floor.receiveShadow = true;
scene.add( floor );

const knot = new THREE.Mesh( new THREE.TorusKnotGeometry( 0.7, 0.25, 160, 24 ), new THREE.MeshPhysicalMaterial( { color: 0xb00012, metalness: 0.4, roughness: 0.3, clearcoat: 1 } ) );
knot.position.y = 1.3;
knot.castShadow = knot.receiveShadow = true;
scene.add( knot );

// ---- pre-compile (no hitch on first frame) ----
let progress = 0;
const t0 = performance.now();
await renderer.compileAsync( scene, camera, null, ( e ) => { progress = e.loaded / e.total; } );
info.compileAsyncMs = Math.round( performance.now() - t0 );
info.compileProgress = progress;

// compiling an object that will be added later (targetScene provides lights/env/fog for the cache key)
const late = new THREE.Mesh( new THREE.SphereGeometry( 0.5, 48, 24 ), new THREE.MeshStandardMaterial( { color: 0x2255cc, roughness: 0.2, metalness: 1 } ) );
late.position.set( - 2, 0.5, 1 );
late.castShadow = true;
await renderer.compileAsync( late, camera, scene );
scene.add( late );

// ---- shader source debug ----
const sh = await renderer.debug.getShaderAsync( scene, camera, knot );
info.shader = { vertexLen: sh.vertexShader.length, fragmentLen: sh.fragmentShader.length, head: sh.fragmentShader.slice( 0, 120 ) };

// ---- animation loop ----
const timer = new THREE.Timer();
timer.connect( document );           // pauses delta accumulation while the tab is hidden
let frame = 0, lastTimeArg = null;
const dts = [];
const size = new THREE.Vector2();

renderer.setAnimationLoop( async ( time /* DOMHighResTimeStamp */, xrFrame ) => {

	timer.update( time );
	const dt = timer.getDelta();
	dts.push( dt );
	lastTimeArg = time;
	knot.rotation.y += dt * 0.6;

	renderer.render( scene, camera );
	frame ++;

	if ( frame === 20 ) {

		// renderer.info is auto-reset at the start of every animation frame (info.autoReset = true)
		info.render = { ...renderer.info.render };
		info.memory = { ...renderer.info.memory };
		info.frame = renderer.info.frame;

		// canvas screenshot: must be taken in the same task as the render (no preserveDrawingBuffer in WebGPU)
		const url = renderer.domElement.toDataURL( 'image/png' );
		info.canvasDataUrlLen = url.length;
		const img = new Image();
		img.src = url;
		await img.decode();
		const c = document.createElement( 'canvas' );
		c.width = 64; c.height = 36;
		const g = c.getContext( '2d' );
		g.drawImage( img, 0, 0, 64, 36 );
		const px = g.getImageData( 0, 0, 64, 36 ).data;
		let sum = 0;
		for ( let i = 0; i < px.length; i += 4 ) sum += px[ i ] + px[ i + 1 ] + px[ i + 2 ];
		info.canvasMeanRGB = Math.round( sum / ( px.length / 4 * 3 ) );

	}

	if ( frame === 30 ) {

		// GPU time of all render passes since the last resolve (ms). Also stored in renderer.info.render.timestamp
		const gpuMs = await renderer.resolveTimestampsAsync( THREE.TimestampQuery.RENDER );
		info.gpuRenderMs = gpuMs;
		info.infoRenderTimestamp = renderer.info.render.timestamp;

	}

	if ( frame === 40 ) {

		// resize (as in a window resize handler)
		renderer.setPixelRatio( 1.5 );
		renderer.setSize( 800, 450 );
		camera.aspect = 800 / 450;
		camera.updateProjectionMatrix();
		info.afterResize = { css: renderer.getSize( size ).toArray(), drawingBuffer: renderer.getDrawingBufferSize( new THREE.Vector2() ).toArray(), canvas: [ renderer.domElement.width, renderer.domElement.height ], pixelRatio: renderer.getPixelRatio() };

	}

	if ( frame === 45 ) {

		renderer.setPixelRatio( 1 );
		renderer.setSize( window.innerWidth, window.innerHeight );
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();

	}

	if ( frame === 60 ) {

		info.timeArgType = typeof lastTimeArg;
		info.meanDt = dts.slice( 5 ).reduce( ( a, b ) => a + b, 0 ) / ( dts.length - 5 );
		info.timerElapsed = timer.getElapsed();
		info.deviceLost = deviceLost;
		info.backendError = backendError;
		info.frames = frame;
		report( info );

	}

} );
</script>
</body>
</html>
