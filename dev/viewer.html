<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>asset viewer</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<!--
Generic asset viewer (three r187 WebGPURenderer). Query params:
  models   comma-separated GLB/GLTF urls, laid out in a row along +X (e.g. /assets/rocks/a.glb,/assets/rocks/b.glb)
  hdr      equirect .hdr used as background + lighting (optional; default = RoomEnvironment + grey background)
  envhdr   separate equirect .hdr for lighting only (optional)
  sun      x,y,z direction TOWARDS the sun (default 0.5,0.8,0.35); sunI = intensity (default 3); sunColor = hex (ffffff)
  az, el   camera azimuth/elevation in degrees (default 35, 18); dist = distance multiplier (default 1.0)
  fov      camera fov (default 35)
  ground   1/0 show ground plane (default 1); groundColor hex (default 777777)
  exposure tone mapping exposure (default 1); tone = aces|agx|neutral|none (default aces)
  bgblur   background blurriness 0..1 (default 0); envI = environment intensity (default 1)
  rotY     rotate all models around Y, degrees (default 0)
  focus    index of the model to frame (default: frame all)
  lod      N -> for files that pack several LODs as nodes named "<name>_LOD0|1|2...", show only nodes of that LOD
           (nodes without a _LOD suffix are always shown). Without this param ALL nodes are shown (LODs overlap!).
  only     substring -> show only meshes whose own or ancestor node name contains this substring (combined with lod)
After load: window.__ready === true, window.__info = { isWebGPU, models:[{url,triangles,vertices,meshes,materials,textures,bbox,size,nodes}] }
Helpers:   window.__setCamera(azDeg, elDeg, distMul, focusIndex?)  then wait ~200ms before a screenshot.
-->
<script type="module">
import * as THREE from 'three/webgpu';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams( location.search );
const num = ( k, d ) => ( q.has( k ) ? Number( q.get( k ) ) : d );
const str = ( k, d ) => ( q.has( k ) ? q.get( k ) : d );

const renderer = new THREE.WebGPURenderer( { antialias: true } );
renderer.setPixelRatio( 1 );
renderer.setSize( window.innerWidth, window.innerHeight );
const tone = str( 'tone', 'aces' );
renderer.toneMapping = { aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping, neutral: THREE.NeutralToneMapping, none: THREE.NoToneMapping }[ tone ] ?? THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num( 'exposure', 1 );
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild( renderer.domElement );
await renderer.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( num( 'fov', 35 ), window.innerWidth / window.innerHeight, 0.01, 5000 );

// ---- environment ----
const hdrUrl = str( 'hdr', '' );
const envHdrUrl = str( 'envhdr', '' );
if ( hdrUrl ) {

	const tex = await new HDRLoader().loadAsync( hdrUrl );
	tex.mapping = THREE.EquirectangularReflectionMapping;
	scene.background = tex;
	scene.environment = tex;
	scene.backgroundBlurriness = num( 'bgblur', 0 );

} else {

	const pmrem = new THREE.PMREMGenerator( renderer );
	scene.environment = pmrem.fromScene( new RoomEnvironment(), 0.04 ).texture;
	scene.background = new THREE.Color( 0x9aa3ad );

}

if ( envHdrUrl ) {

	const tex = await new HDRLoader().loadAsync( envHdrUrl );
	tex.mapping = THREE.EquirectangularReflectionMapping;
	scene.environment = tex;

}

scene.environmentIntensity = num( 'envI', 1 );

// ---- models ----
const draco = new DRACOLoader().setDecoderPath( '/libs/draco/gltf/' );
const loader = new GLTFLoader().setDRACOLoader( draco ).setMeshoptDecoder( MeshoptDecoder );

const urls = str( 'models', '' ).split( ',' ).map( ( s ) => s.trim() ).filter( Boolean );
const group = new THREE.Group();
scene.add( group );
const info = { isWebGPU: renderer.backend.isWebGPUBackend === true, models: [] };
const roots = [];
let cursorX = 0;

for ( const url of urls ) {

	const gltf = await loader.loadAsync( url );
	const root = gltf.scene;
	root.rotation.y = THREE.MathUtils.degToRad( num( 'rotY', 0 ) );
	root.updateMatrixWorld( true );

	// optional LOD / name filtering (removes non-matching nodes so stats + framing reflect what is shown)
	const lodParam = q.has( 'lod' ) ? Number( q.get( 'lod' ) ) : null;
	const onlyParam = str( 'only', '' );
	if ( lodParam !== null || onlyParam ) {

		const remove = [];
		root.traverse( ( o ) => {

			const m = /_LOD(\d+)$/i.exec( o.name || '' );
			if ( lodParam !== null && m && Number( m[ 1 ] ) !== lodParam ) remove.push( o );
			if ( onlyParam && o.isMesh ) {

				let match = false;
				for ( let p = o; p; p = p.parent ) if ( ( p.name || '' ).includes( onlyParam ) ) match = true;
				if ( ! match ) remove.push( o );

			}

		} );
		for ( const o of remove ) o.removeFromParent();

	}

	let triangles = 0, vertices = 0, meshes = 0;
	const materials = new Map();
	const textures = new Map();
	const nodes = [];
	root.traverse( ( o ) => {

		if ( o.name ) nodes.push( o.name + ( o.isMesh ? ' [mesh]' : '' ) );
		if ( ! o.isMesh ) return;
		meshes ++;
		o.castShadow = true;
		o.receiveShadow = true;
		const g = o.geometry;
		const count = o.isInstancedMesh ? o.count : 1;
		vertices += g.attributes.position.count * count;
		triangles += ( g.index ? g.index.count / 3 : g.attributes.position.count / 3 ) * count;
		for ( const m of Array.isArray( o.material ) ? o.material : [ o.material ] ) {

			materials.set( m.uuid, {
				name: m.name, type: m.type, alphaTest: m.alphaTest, transparent: m.transparent, side: m.side,
				metalness: m.metalness, roughness: m.roughness, color: m.color ? '#' + m.color.getHexString() : null,
			} );
			for ( const key of [ 'map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'alphaMap' ] ) {

				const t = m[ key ];
				if ( t && t.image ) textures.set( t.uuid, { slot: key, name: t.name, width: t.image.width, height: t.image.height } );

			}

		}

	} );

	const box = new THREE.Box3().setFromObject( root );
	const size = box.getSize( new THREE.Vector3() );
	// place in a row along +X, resting on the ground
	root.position.x += cursorX - box.min.x;
	root.position.y += - box.min.y;
	cursorX += size.x + Math.max( size.x, size.z ) * 0.25 + 0.05;
	group.add( root );
	roots.push( root );
	info.models.push( {
		url, triangles: Math.round( triangles ), vertices, meshes,
		materials: [ ...materials.values() ], textures: [ ...textures.values() ],
		bbox: { min: box.min.toArray(), max: box.max.toArray() }, size: size.toArray(),
		nodes: nodes.slice( 0, 400 ), animations: gltf.animations.map( ( a ) => a.name ),
	} );

}

// ---- lights / ground ----
const sunDir = new THREE.Vector3( ...str( 'sun', '0.5,0.8,0.35' ).split( ',' ).map( Number ) ).normalize();
const sun = new THREE.DirectionalLight( new THREE.Color( '#' + str( 'sunColor', 'ffffff' ) ), num( 'sunI', 3 ) );
sun.castShadow = true;
sun.shadow.mapSize.set( 4096, 4096 );
sun.shadow.bias = - 0.0005;
sun.shadow.normalBias = 0.02;
scene.add( sun );
scene.add( sun.target );

const all = new THREE.Box3();
if ( roots.length ) all.setFromObject( group ); else all.set( new THREE.Vector3( - 1, 0, - 1 ), new THREE.Vector3( 1, 1, 1 ) );
const allSize = all.getSize( new THREE.Vector3() );
const allCenter = all.getCenter( new THREE.Vector3() );
const radius = Math.max( allSize.length() * 0.5, 0.05 );

sun.target.position.copy( allCenter );
sun.position.copy( allCenter ).addScaledVector( sunDir, radius * 4 );
const sc = sun.shadow.camera;
sc.left = - radius * 1.3; sc.right = radius * 1.3; sc.top = radius * 1.3; sc.bottom = - radius * 1.3;
sc.near = radius * 0.5; sc.far = radius * 8;
sc.updateProjectionMatrix();

if ( num( 'ground', 1 ) ) {

	const ground = new THREE.Mesh(
		new THREE.PlaneGeometry( radius * 40, radius * 40 ),
		new THREE.MeshStandardMaterial( { color: new THREE.Color( '#' + str( 'groundColor', '777777' ) ), roughness: 0.9 } )
	);
	ground.rotation.x = - Math.PI / 2;
	ground.receiveShadow = true;
	scene.add( ground );

}

function setCamera( azDeg, elDeg, distMul = 1, focusIndex = null ) {

	let center = allCenter, r = radius;
	if ( focusIndex !== null && roots[ focusIndex ] ) {

		const b = new THREE.Box3().setFromObject( roots[ focusIndex ] );
		center = b.getCenter( new THREE.Vector3() );
		r = Math.max( b.getSize( new THREE.Vector3() ).length() * 0.5, 0.05 );

	}

	const az = THREE.MathUtils.degToRad( azDeg ), el = THREE.MathUtils.degToRad( elDeg );
	const fovRad = THREE.MathUtils.degToRad( camera.fov );
	const fit = r / Math.sin( Math.min( fovRad, 2 * Math.atan( Math.tan( fovRad / 2 ) * camera.aspect ) ) / 2 );
	const d = fit * 1.08 * distMul;
	camera.position.set(
		center.x + d * Math.cos( el ) * Math.sin( az ),
		center.y + d * Math.sin( el ),
		center.z + d * Math.cos( el ) * Math.cos( az )
	);
	camera.near = Math.max( d / 500, 0.005 );
	camera.far = Math.max( d * 60, 100 );
	camera.updateProjectionMatrix();
	camera.lookAt( center );

}

const focus = q.has( 'focus' ) ? Number( q.get( 'focus' ) ) : null;
setCamera( num( 'az', 35 ), num( 'el', 18 ), num( 'dist', 1 ), focus );
window.__setCamera = setCamera;
window.__scene = scene;
window.__camera = camera;
window.__renderer = renderer;
window.__THREE = THREE;

window.addEventListener( 'resize', () => {

	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize( window.innerWidth, window.innerHeight );

} );

let frames = 0;
renderer.setAnimationLoop( () => {

	renderer.render( scene, camera );
	frames ++;
	if ( frames === 12 ) {

		window.__info = info;
		window.__ready = true;

	}

} );
</script>
</body>
</html>
