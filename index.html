<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CS 61B · Project 5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a22'/%3E%3Cpath d='M3 25 12 10l5 8 3-5 9 12z' fill='%23ff8a4c'/%3E%3Cpath d='M12 10l2.2 3.5-2.2 1.6-2-1.8z' fill='%23ffd9b8'/%3E%3C/svg%3E">
<style>
/* Boot splash only - shown before any module has loaded. The UI system styles everything else. */
html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; }
body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #e8ecf1; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#ui { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
	background: radial-gradient(120% 90% at 50% 110%, #3a2418 0%, #141a22 45%, #0b0e12 100%); transition: opacity .8s ease; z-index: 100; }
#boot.done { opacity: 0; pointer-events: none; }
#boot .boot-title { font-size: clamp(30px, 6vw, 68px); font-weight: 200; letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase; }
#boot .boot-sub { font-size: 12px; letter-spacing: .34em; text-transform: uppercase; opacity: .55; margin-top: -10px; }
#boot .boot-track { width: min(340px, 60vw); height: 2px; background: rgba(255,255,255,.14); overflow: hidden; border-radius: 2px; }
#boot-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff8a4c, #ffd9b8); transition: width .25s ease; }
#boot-label { font-size: 12px; letter-spacing: .08em; opacity: .6; min-height: 1.2em; text-align: center; padding: 0 24px; max-width: 80vw; }
#boot.error .boot-title { font-size: clamp(18px, 3vw, 28px); letter-spacing: .1em; margin-right: 0; font-weight: 400; }
#boot.error .boot-track, #boot.error .boot-sub { display: none; }
#boot.error #boot-label { opacity: .85; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
	<canvas id="view" tabindex="0"></canvas>
	<div id="ui"></div>
	<div id="boot">
		<div class="boot-title">Project 5</div>
		<div class="boot-sub">CS 61B · Data Structures</div>
		<div class="boot-track"><div id="boot-bar"></div></div>
		<div id="boot-label">Loading</div>
	</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
